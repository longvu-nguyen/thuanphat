<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang chuyển hướng | Thuận Phát Technology</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(14, 165, 233, 0.2);
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 20px; margin-bottom: 8px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    a {
      display: inline-block;
      padding: 10px 24px;
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2>Thuận Phát Technology</h2>
    <p>Đang tự động chuyển hướng đến trang tương ứng...</p>
    <a id="redirectLink" href="./index.html">Bấm vào đây nếu không tự chuyển</a>
  </div>

  <script>
    (function() {
      var currentPath = window.location.pathname.toLowerCase();
      var basePath = "./index.html";
      var target = basePath + "#trang-chu";

      if (currentPath.indexOf("gioi-thieu") !== -1) {
        target = basePath + "#gioi-thieu";
      } else if (currentPath.indexOf("giai-phap") !== -1) {
        target = basePath + "#giai-phap";
      } else if (
        currentPath.indexOf("may-scan") !== -1 ||
        currentPath.indexOf("may-in") !== -1 ||
        currentPath.indexOf("photocopy") !== -1 ||
        currentPath.indexOf("san-pham") !== -1 ||
        currentPath.indexOf(".html") !== -1
      ) {
        target = basePath + "#san-pham";
      }

      document.getElementById("redirectLink").href = target;
      setTimeout(function() {
        window.location.replace(target);
      }, 500);
    })();
  </script>
</body>
</html>
